# Project-level env_file (Compose 2.24+): supplies values for ${VAR}
# interpolation in this file (marketing build.args.PUBLIC_GA_ID, etc.).
# It is not a substitute for service env_file on api, which still injects
# the same file into the API container at runtime. Do not copy this file
# into the marketing runtime container — Astro bakes PUBLIC_* at image build.
env_file: ../backend/.env.qa

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../backend/.env.qa
    environment:
      INTEGRATED_DOCS_AUTO_ROLLOUT: ${INTEGRATED_DOCS_AUTO_ROLLOUT:-if-needed}
      CAPTCHA_MODE: ${CAPTCHA_MODE:-enforce}
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # Use image default CMD → runs migrations then starts the API

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    env_file: ../frontend/.env.qa
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    # nginx serves the built SPA and proxies /api to api:8080

  marketing:
    build:
      context: ../marketing
      dockerfile: Dockerfile
      args:
        # Interpolated from project-level env_file (backend/.env.qa).
        # Set PUBLIC_GA_ID there to ship gtag (G-JNTR8JXN1Q for kanap.net).
        PUBLIC_GA_ID: ${PUBLIC_GA_ID:-}
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped
