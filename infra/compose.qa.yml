services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../backend/.env.qa
    environment:
      INTEGRATED_DOCS_AUTO_ROLLOUT: ${INTEGRATED_DOCS_AUTO_ROLLOUT:-if-needed}
      CAPTCHA_MODE: ${CAPTCHA_MODE:-enforce}
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # Use image default CMD → runs migrations then starts the API

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    env_file: ../frontend/.env.qa
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    # nginx serves the built SPA and proxies /api to api:8080

  marketing:
    build:
      context: ../marketing
      dockerfile: Dockerfile
      args:
        # Same as prod: set PUBLIC_GA_ID in host env to ship gtag (G-JNTR8JXN1Q for kanap.net).
        PUBLIC_GA_ID: ${PUBLIC_GA_ID:-}
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped
