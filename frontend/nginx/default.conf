server {
  listen 80;
  server_name _;
  client_max_body_size 20m;
  root /usr/share/nginx/html;
  index index.html;

  # Declared once and repeated in every location that adds a header of its own: a nested
  # add_header replaces the inherited set, so the CSP would silently disappear from that
  # response.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.your-objectstorage.com; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self';";
  add_header Content-Security-Policy $csp always;

  # Proxy API requests to the backend service on the Docker network
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # The SPA shell must never be cached: it is what points at the hashed bundles, so a stale
  # copy keeps loading chunk names that a deploy has already removed.
  location = /index.html {
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Hashed build output. A missing chunk has to 404 rather than fall back to index.html:
  # answering 200 text/html for /assets/<chunk>.js is cached as immutable and leaves the app
  # parsing HTML as JavaScript after a deploy.
  location ^~ /assets/ {
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    expires 7d;
    access_log off;
    try_files $uri =404;
  }

  # Same for the loose asset types served from the root (fonts, svg).
  location ~* \.(?:js|css|woff2?|eot|ttf|otf|svg)$ {
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    expires 7d;
    access_log off;
    try_files $uri =404;
  }

  # Client-side routes: fall back to the shell.
  location / {
    try_files $uri /index.html;
  }
}
